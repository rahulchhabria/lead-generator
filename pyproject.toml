[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospect-intelligence"
version = "2.0.0"
description = "Unified B2B prospect intelligence platform - enrichment + lead generation powered by Claude"
requires-python = ">=3.11"
dependencies = [
    # Core AI
    "anthropic>=0.40.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Data
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # HTTP / scraping
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.2.0",
    "dnspython>=2.4.0",
    # Web server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Auth
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
hunter = ["pyhunter>=1.7.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
leadgen = "src.cli:app"
prospect = "src.web.main:start"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = []
